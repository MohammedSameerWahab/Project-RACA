[project]
name = "project-raca"
version = "0.1.0"
description = "Repository aware coding assistant using hybrid retrieval"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "cocoindex[lancedb,neo4j,postgres,sentence-transformers]>=1.0.23",
    "fastapi>=0.142.2",
    "neo4j>=6.3.1",
    "numpy>=2.5.3",
    "openai>=2.8.1",
    "pgvector>=0.5.0",
    "uvicorn>=0.54.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
